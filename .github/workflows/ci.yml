name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      # config.py raises on a missing JWT secret in prod profile; tests run in dev.
      ORB_DEPLOYMENT_PROFILE: dev
      # conftest.py points the DB at a throwaway temp file via this var.
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install slim test dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch first: the default wheel pulls ~7 GB of CUDA deps the
          # tests never use, eating runner disk shared with the rest of the job.
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Lint ratchet: the pre-existing backlog (mostly no-explicit-any) is
      # recorded in .lint-baseline.json; the gate FAILS only if the problem
      # count rises above it, so new debt is blocked while the backlog is paid
      # down incrementally (lower the baseline with `--update` as it drops).
      - name: Lint ratchet
        run: node scripts/lint-ratchet.mjs
      # `npm run build` runs `tsc -b` first, so this gates both typecheck and build.
      - name: Typecheck + build
        run: npm run build
      - name: Unit tests
        run: npm run test

  # Drives every screen (all roles, all tabs/sub-tabs) in BOTH themes against a
  # mocked API, auto-checks contrast/visibility/misalignment + JS errors, and
  # fails on any non-allowlisted finding. See tests/visual/README.md.
  visual-audit:
    name: Visual audit (light + dark)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Install audit browser
        run: |
          npm install --no-save playwright wait-on
          npx playwright install --with-deps chromium
      - name: Start dev server
        run: |
          npm run dev -- --port 5173 --host 127.0.0.1 &
          npx wait-on http://127.0.0.1:5173 --timeout 90000
      - name: Run visual audit
        run: node tests/visual/driver.cjs
      - name: Gate on findings
        run: node tests/visual/ci-gate.cjs
      - name: Upload screenshots + results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-audit
          path: |
            tests/visual/shots/
            tests/visual/audit-results.json
          retention-days: 14

  # Golden-journey e2e: real FastAPI backend + Vite dev server, both booted by
  # playwright.config.ts (webServer array — expects server/.venv-dev to exist).
  e2e:
    name: E2E (5 golden journeys)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - run: npm ci
      # Slim CPU-only deps: the full requirements.txt drags torch+CUDA wheels
      # (~8 GB) plus Mac-only packages onto a ~14 GB runner — the job previously
      # died with "no space left on device" mid-run. CPU torch first so the
      # requirements-dev resolve reuses it instead of the CUDA build.
      - name: Create backend venv (path expected by playwright.config.ts)
        run: |
          python -m venv server/.venv-dev
          server/.venv-dev/bin/pip install --upgrade pip
          server/.venv-dev/bin/pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          server/.venv-dev/bin/pip install -r server/requirements-dev.txt
      - name: Seed demo database
        env:
          ORB_DEPLOYMENT_PROFILE: dev
          ORB_JWT_SECRET: ci-only-secret
        working-directory: server
        run: .venv-dev/bin/python scripts/reset_db_and_seed.py
      - name: Install e2e browser
        run: npx playwright install --with-deps chromium
      - name: Run e2e
        env:
          ORB_DEPLOYMENT_PROFILE: dev
          ORB_JWT_SECRET: ci-only-secret
        run: npm run test:e2e
      - name: Upload e2e report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: playwright-report/
          retention-days: 14
