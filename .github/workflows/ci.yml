name: CI

on:
  workflow_call:
    inputs:
      ref:
        description: Verified commit to test for a candidate build
        required: false
        type: string
        default: ""
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      # config.py raises on a missing JWT secret in prod profile; tests run in dev.
      ORB_DEPLOYMENT_PROFILE: dev
      # conftest.py points the DB at a throwaway temp file via this var.
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements-dev.txt
            server/requirements-bootstrap.txt
            server/requirements-quality.txt
            server/constraints-security.txt
      - name: Install slim test dependencies
        run: |
          python -m pip install -r requirements-bootstrap.txt
          # CPU-only torch first: the default wheel pulls ~7 GB of CUDA deps the
          # tests never use, eating runner disk shared with the rest of the job.
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Verify security test dependencies
        # Missing optional runtime packages used to turn encryption and restore
        # regressions into skips on a fresh CI runner.
        run: python -c "import bcrypt, cryptography, qrcode, png, sqlcipher3"
      - name: Install pinned Python quality tools
        run: python -m pip install -r requirements-quality.txt
      # This is an explicit two-file adoption scope, not whole-backend compliance.
      # Keep the full pytest job below: the scoped coverage selection cannot replace it.
      - name: Scoped Python lint and formatting
        working-directory: .
        run: |
          python -m ruff check --config tools/python-quality/pyproject.toml server/routes/import_mapping.py scripts/release_candidate.py
          python -m ruff format --check --config tools/python-quality/pyproject.toml server/routes/import_mapping.py scripts/release_candidate.py
      - name: Scoped Python strict typing
        working-directory: .
        run: python -m mypy --config-file tools/python-quality/pyproject.toml
      - name: Scoped Python statement and branch coverage
        working-directory: .
        run: |
          python -m coverage run --rcfile=tools/python-quality/pyproject.toml -m pytest -q \
            server/tests/test_import_and_time_compatibility.py::test_both_importers_preserve_mapping_form_values \
            server/tests/test_import_and_time_compatibility.py::test_both_importers_reject_ambiguous_mapping_types_with_422 \
            server/tests/test_release_candidate.py
          python -m coverage report --rcfile=tools/python-quality/pyproject.toml
          python -m coverage json --rcfile=tools/python-quality/pyproject.toml
          python -c 'import json; from pathlib import Path; report = json.loads(Path("python-quality-coverage.json").read_text()); assert set(report["files"]) == {"server/routes/import_mapping.py", "scripts/release_candidate.py"}, "Coverage must include both declared utilities"'
      - name: Upload scoped Python coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-quality-coverage
          path: python-quality-coverage.json
          if-no-files-found: warn
          retention-days: 14
      - name: Run tests with complete backend coverage
        run: |
          python -m pip install coverage==7.16.2
          python -m coverage run --rcfile=../tools/backend-quality/coverage.ini -m pytest -q
          python -m coverage json --rcfile=../tools/backend-quality/coverage.ini -o backend-coverage.json
          python ../tools/backend-quality/backend_quality.py coverage --report backend-coverage.json --baseline ../tools/backend-quality/coverage-baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: server/backend-coverage.json
          if-no-files-found: warn

  local-inference-quality:
    name: Local inference utilities (strict checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated developer tools
        run: python -m pip install -r tools/local-inference-quality/requirements.txt
      - name: Lint, format, strict typing and full scoped coverage
        run: bash tools/local-inference-quality/check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-inference-coverage
          path: local-inference-coverage.json
          if-no-files-found: warn

  backend-wide-quality:
    name: Backend-wide engineering budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned standalone check tools
        run: python -m pip install -r tools/local-inference-quality/requirements.txt
      - name: Reject critical Python defects and unreviewed quality debt
        run: |
          python -m ruff check --select E9,F63,F7,F82,F811 server
          python tools/backend-quality/backend_quality.py check
          python -m pytest --noconftest -q tools/backend-quality

  frontend:
    name: Frontend (build + tests)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Lint ratchet: the pre-existing backlog (mostly no-explicit-any) is
      # recorded in .lint-baseline.json; the gate FAILS only if the problem
      # count rises above it, so new debt is blocked while the backlog is paid
      # down incrementally (lower the baseline with `--update` as it drops).
      - name: Lint ratchet
        run: node scripts/lint-ratchet.mjs
      # `npm run build` runs `tsc -b` first, so this gates both typecheck and build.
      - name: Typecheck + build
        run: npm run build
      - name: Unit tests
        run: npm run test
      - name: Upload candidate frontend
        if: inputs.ref != ''
        uses: actions/upload-artifact@v4
        with:
          name: candidate-frontend
          path: dist/
          if-no-files-found: error
          retention-days: 14

  # Drives every screen (all roles, all tabs/sub-tabs) in BOTH themes against a
  # mocked API, auto-checks contrast/visibility/misalignment + JS errors, and
  # fails on any non-allowlisted finding. See tests/visual/README.md.
  visual-audit:
    name: Visual audit (light + dark)
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install audit browser
        run: |
          npx playwright install --with-deps chromium
      - name: Verify visual checker regressions
        run: node --test tests/visual/checks-regression.cjs tests/visual/driver-regression.cjs tests/visual/offline-fixtures-regression.cjs scripts/sage_browser_timing.test.cjs
      - name: Build production frontend
        run: npm run build
      - name: Start production preview
        run: |
          npm run preview -- --port 5173 --host 127.0.0.1 --strictPort &
          for attempt in $(seq 1 90); do
            if curl --fail --silent --max-time 1 http://127.0.0.1:5173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Production preview did not become ready within 90 seconds" >&2
          exit 1
      - name: Run visual audit
        run: node tests/visual/driver.cjs
      - name: Gate on findings
        run: node tests/visual/ci-gate.cjs
      - name: Upload screenshots + results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-audit
          path: |
            tests/visual/out/
          retention-days: 14

  # Five golden + six offline journeys: production frontend and an owned seeded DB.
  e2e:
    name: E2E (11 real-backend journeys)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements-dev.txt
            server/requirements-bootstrap.txt
            server/constraints-security.txt
      - run: npm ci
      # Slim CPU-only deps: the full requirements.txt drags torch+CUDA wheels
      # (~8 GB) plus Mac-only packages onto a ~14 GB runner — the job previously
      # died with "no space left on device" mid-run. CPU torch first so the
      # requirements-dev resolve reuses it instead of the CUDA build.
      - name: Create backend venv (path expected by playwright.config.ts)
        run: |
          python -m venv server/.venv-dev
          server/.venv-dev/bin/python -m pip install -r server/requirements-bootstrap.txt
          server/.venv-dev/bin/pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          server/.venv-dev/bin/pip install -r server/requirements-dev.txt
      - name: Install e2e browser
        run: npx playwright install --with-deps chromium
      - name: Run e2e
        env:
          ORB_DEPLOYMENT_PROFILE: dev
          ORB_JWT_SECRET: ci-only-secret
        run: npm run test:e2e
      - name: Upload e2e report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: playwright-report/
          retention-days: 14
