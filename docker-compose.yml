# Orb Hospital OS — deployment topology.
#
# Two services on the default compose network:
#   ollama : the LLM runtime (MedGemma etc.), reachable at http://ollama:11434
#   orb    : the FastAPI backend + built SPA (image built from ./Dockerfile)
#
# ── Pointing Orb at a different Ollama ─────────────────────────────────────────
# server/config.py reads ORB_OLLAMA_BASE_URL (default http://localhost:11434), so
# any topology works without patching code:
#   sibling container (this file) : http://ollama:11434
#   Ollama on the Docker host     : http://host.docker.internal:11434
#                                   (the only way to reach the GPU on macOS)
#   remote GPU box                : http://gpu-host.internal:11434
# When Ollama runs outside compose, drop the `ollama` service and its depends_on.

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      # Ollama API. Bind to loopback on the host in production if you don't need
      # external model access: "127.0.0.1:11434:11434". Orb reaches it over the
      # compose network by service name, so this publish is for host tooling only.
      - "11434:11434"
    volumes:
      # Persist pulled models (e.g. medgemma:27b) across restarts so you don't
      # re-download multi-GB weights. Pull via:
      #   docker compose exec ollama ollama pull medgemma:27b
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    # Uncomment to expose host NVIDIA GPUs to Ollama (requires nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  orb:
    build: .
    restart: unless-stopped
    ports:
      # Orb API + SPA. Put Orb behind a TLS-terminating reverse proxy in production
      # (see docs/DEPLOYMENT.md); the app serves cleartext HTTP with no TLS in-container.
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      # ── REQUIRED IN PRODUCTION ──────────────────────────────────────────────
      # Deployment profile. Defaults to "prod" inside config.py. In "prod" the app
      # REFUSES TO BOOT unless the two secrets below are set (see config.py).
      ORB_DEPLOYMENT_PROFILE: "${ORB_DEPLOYMENT_PROFILE:-prod}"
      # JWT signing secret. MUST be set in prod or the app raises at startup.
      # Generate one: `openssl rand -hex 32`.
      ORB_JWT_SECRET: "${ORB_JWT_SECRET:?ORB_JWT_SECRET must be set (openssl rand -hex 32)}"
      # Ingestion API key protecting the real-patient write path (/api/ingest/*).
      # ALSO mandatory in prod (config.py fails closed just like JWT_SECRET).
      ORB_INGESTION_API_KEY: "${ORB_INGESTION_API_KEY:?ORB_INGESTION_API_KEY must be set}"

      # ── Encryption at rest (PHI) ────────────────────────────────────────────
      # Without these keys the app stores uploaded PHI media (Lens images, Scribe
      # audio) and encrypted-column values in CLEARTEXT after a single startup
      # warning. Generate with `openssl rand -hex 32` and keep them out of the
      # image — they are read from the host environment / .env at `up` time.
      ORB_UPLOAD_ENCRYPTION_KEY: "${ORB_UPLOAD_ENCRYPTION_KEY:-}"
      ORB_DB_ENCRYPTION_KEY: "${ORB_DB_ENCRYPTION_KEY:-}"
      # Field-level column crypto; falls back to ORB_DB_ENCRYPTION_KEY when unset.
      ORB_FIELD_ENCRYPTION_KEY: "${ORB_FIELD_ENCRYPTION_KEY:-}"
      # Set both to 1 once the keys above are in place: an unavailable cipher then
      # becomes a hard error instead of a silent cleartext PHI write.
      ORB_REQUIRE_UPLOAD_ENCRYPTION: "${ORB_REQUIRE_UPLOAD_ENCRYPTION:-}"
      ORB_REQUIRE_FIELD_ENCRYPTION: "${ORB_REQUIRE_FIELD_ENCRYPTION:-}"

      # ── Networking ──────────────────────────────────────────────────────────
      ORB_HOST: "0.0.0.0"
      ORB_PORT: "8000"
      # Lock CORS down to the origin(s) your SPA is actually served from in prod.
      ORB_CORS_ORIGINS: "${ORB_CORS_ORIGINS:-http://localhost:8000}"
      # Where the LLM runtime lives. Override for host/remote Ollama, e.g.
      # http://host.docker.internal:11434 (macOS host GPU).
      ORB_OLLAMA_BASE_URL: "${ORB_OLLAMA_BASE_URL:-http://ollama:11434}"

      # ── Data / models ───────────────────────────────────────────────────────
      # SQLite DB path inside the container -> persisted on the orb-data volume.
      ORB_DB_PATH: "/data/orb.db"
      # LLM model name as pulled in Ollama. Use the 4B fallback on small hardware
      # (see docs/DEPLOYMENT.md): ORB_LLM_MODEL=alibayram/medgemma:4b
      ORB_LLM_MODEL: "${ORB_LLM_MODEL:-medgemma:27b}"
      # Real data only; simulation bots off. Set to "simulation" or "hybrid" for demos.
      ORB_INGESTION_MODE: "${ORB_INGESTION_MODE:-ingestion}"
    volumes:
      # Persist the SQLite database (ORB_DB_PATH=/data/orb.db).
      - orb-data:/data
      # Persist uploaded PHI media. config.UPLOAD_DIR is /app/server/uploads and is
      # NOT env-overridable, so we mount the volume at that exact path.
      - orb-uploads:/app/server/uploads

volumes:
  ollama-models:
  orb-data:
  orb-uploads:
