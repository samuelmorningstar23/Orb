[pytest]
# Only collect the curated suite under tests/ — keeps ad-hoc scripts under
# scripts/ (e.g. scripts/test_audio.py) and dev_tools/ out of collection.
testpaths = tests
# Run @pytest.mark.asyncio tests natively. Before this, pytest-asyncio was not
# installed and 4 async tests were silently SKIPPED rather than executed.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
