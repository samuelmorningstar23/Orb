# This gate covers these six utilities only, not the full backend.
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.12"
strict = true
files = ["server/offline_policy.py", "server/services/asr_worker_protocol.py", "server/services/inference_cache.py", "server/security_headers.py", "server/spa_bootstrap.py", "server/services/warm_policy.py"]
[tool.coverage.run]
branch = true
relative_files = true
data_file = ".coverage-local-inference"
include = ["server/offline_policy.py", "server/services/asr_worker_protocol.py", "server/services/inference_cache.py", "server/security_headers.py", "server/spa_bootstrap.py", "server/services/warm_policy.py"]
[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 100
[tool.coverage.json]
output = "local-inference-coverage.json"
